<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 보호된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d0a073; border-radius: 14px; color: #ffe9d4; background: #61472a44; }
    .auth-box { margin: 24px 0; padding: 20px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth-box h2 { font-size: 20px; margin: 0 0 16px; }
    .auth-form { display: grid; gap: 12px; }
    .auth-form label { display: grid; gap: 6px; color: #bfd0e5; font-size: 14px; }
    .auth-form input { width: 100%; padding: 12px; font: inherit; background: #101a28; color: #ecf4ff; border: 1px solid #51667c; border-radius: 8px; }
    .auth-box button { padding: 11px 16px; font: inherit; font-weight: 700; background: #8ad8df; color: #101a28; border: 0; border-radius: 8px; cursor: pointer; }
    .auth-box button:disabled { opacity: .6; cursor: wait; }
    .auth-status { margin: 10px 0 0; font-size: 14px; color: #bfd0e5; }
    .auth-error { margin: 10px 0 0; font-size: 14px; color: #ffadb9; min-height: 1.5em; }
    .memo-editor { margin: 22px 0; padding: 20px; border-radius: 14px; background: #1a2a3d; border: 1px solid #51667c; }
    .memo-editor input, .memo-editor textarea { display: block; width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #51667c; border-radius: 8px; background: #101a28; color: #ecf4ff; font: inherit; }
    .memo-editor textarea { min-height: 96px; resize: vertical; }
    .memo-editor button, .memo-actions button { padding: 9px 14px; margin: 8px 8px 0 0; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; cursor: pointer; }
    .memo-actions button:last-child { background: #51667c; color: white; }
    #memo-feedback { color: #ffbec6; min-height: 1.5em; }
    [hidden] { display: none !important; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 10단계 — 검증한 사본에서 복원</div>
    <h1>보호된 자료실</h1>
    <p>서버 인증 경유로 이메일·비밀번호 로그인을 할 수 있습니다.</p>

    <section class="auth-box" aria-labelledby="auth-heading">
      <h2 id="auth-heading">계정 인증</h2>
      <form id="login-form" class="auth-form">
        <label>이메일
          <input id="email-input" type="email" autocomplete="username" required>
        </label>
        <label>비밀번호
          <input id="password-input" type="password" autocomplete="current-password" required>
        </label>
        <button id="login-btn" type="submit">로그인</button>
      </form>
      <div id="logged-in-view" hidden>
        <p class="auth-status">로그인 계정: <strong id="user-email-display"></strong></p>
        <button id="logout-btn" type="button">로그아웃</button>
      </div>
      <p id="auth-status" class="auth-status" aria-live="polite">로그인 상태 확인 중...</p>
      <p id="auth-error" class="auth-error" role="alert"></p>
    </section>

    <div class="notice">모든 메모 요청은 Vercel 서버 함수를 통하며, 로그인 및 소유자 검사를 거쳐 처리합니다.</div>
    <form id="memo-editor" class="memo-editor" hidden>
      <h2>가상 메모 추가</h2>
      <label>제목<input id="memo-title" maxlength="120" required></label>
      <label>내용<textarea id="memo-body" maxlength="4000"></textarea></label>
      <button id="memo-add" type="submit">메모 추가</button>
      <p id="memo-feedback" aria-live="polite"></p>
    </form>
    <section id="recovery-panel" class="memo-editor" hidden aria-labelledby="recovery-heading">
      <h2 id="recovery-heading">가상 메모 한 건 복원</h2>
      <p>백업이 있는 시험 메모의 ID를 입력하고 변경 항목을 확인하세요.</p>
      <form id="recovery-preview-form">
        <label>복원할 메모 ID<input id="recovery-id" required autocomplete="off"></label>
        <button id="recovery-preview" type="submit">복원할 항목 확인</button>
      </form>
      <div id="recovery-confirmation" hidden>
        <p id="recovery-details"></p>
        <button id="recovery-apply" type="button">확인한 한 건 복원</button>
      </div>
      <p id="recovery-feedback" aria-live="polite"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>메모를 보려면 로그인하세요.</li></ul>
  </main>

  <script type="module">
    const form = document.querySelector('#login-form');
    const loginBtn = document.querySelector('#login-btn');
    const logoutBtn = document.querySelector('#logout-btn');
    const loggedInView = document.querySelector('#logged-in-view');
    const emailInput = document.querySelector('#email-input');
    const passwordInput = document.querySelector('#password-input');
    const userEmail = document.querySelector('#user-email-display');
    const status = document.querySelector('#auth-status');
    const errorText = document.querySelector('#auth-error');

    const notesList = document.querySelector('#notes');
    const editor = document.querySelector('#memo-editor');
    const memoTitle = document.querySelector('#memo-title');
    const memoBody = document.querySelector('#memo-body');
    const memoFeedback = document.querySelector('#memo-feedback');
    let currentSession = null;
    const memoRequest = async (method, path, input) => {
      if (!currentSession?.user) throw new Error('로그인이 필요합니다.');
      const response = await fetch(path, {
        method,
        cache: 'no-store',
        headers: {
          // The browser sends only the Vercel session cookie, never a Supabase data key.
          ...(input === undefined ? {} : { 'Content-Type': 'application/json' }),
        },
        ...(input === undefined ? {} : { body: JSON.stringify(input) }),
      });
      const data = response.status === 204 ? null : await response.json().catch(() => null);
      if (!response.ok) throw new Error(data?.error || '요청 실패 (' + response.status + ')');
      return data;
    };
    let recoveryPlan = null;
    let recoveryGeneration = 0;
    const recoveryPanel = document.querySelector('#recovery-panel');
    const recoveryId = document.querySelector('#recovery-id');
    const recoveryConfirmation = document.querySelector('#recovery-confirmation');
    const recoveryDetails = document.querySelector('#recovery-details');
    const recoveryFeedback = document.querySelector('#recovery-feedback');
    const recoveryPreview = document.querySelector('#recovery-preview');
    const recoveryApply = document.querySelector('#recovery-apply');
    const resetRecovery = () => {
      ++recoveryGeneration;
      recoveryPlan = null;
      recoveryConfirmation.hidden = true;
      recoveryDetails.textContent = '';
      recoveryFeedback.textContent = '';
    };
    recoveryId.addEventListener('input', resetRecovery);
    document.querySelector('#recovery-preview-form').addEventListener('submit', async event => {
      event.preventDefault();
      resetRecovery();
      const generation = recoveryGeneration;
      const id = recoveryId.value.trim().toLowerCase();
      if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/u.test(id)) {
        recoveryFeedback.textContent = '메모 ID 형식이 올바르지 않습니다.';
        return;
      }
      recoveryPreview.disabled = true;
      try {
        const plan = await memoRequest('POST', '/api/restore/' + encodeURIComponent(id), { preview: true });
        if (generation !== recoveryGeneration || !currentSession) return;
        if (plan?.id !== id || plan.verified !== true
            || !/^[0-9a-f]{64}$/u.test(plan.version ?? '')
            || !/^[0-9a-f]{64}$/u.test(plan.stateVersion ?? '')
            || !Array.isArray(plan.changedFields)) throw new Error('복원 사본 검증 실패');
        recoveryPlan = { id, version: plan.version, stateVersion: plan.stateVersion };
        const labels = { title: '제목', content: '내용', owner_id: '소유권을 검증된 백업의 소유자로 복원', create: '삭제된 메모 다시 생성' };
        recoveryDetails.textContent = '대상: ' + id + ' · 백업 버전: ' + plan.version
          + ' · 백업 시각: ' + plan.capturedAt + ' · 변경 항목: '
          + (plan.changedFields.map(field => labels[field] ?? field).join(', ') || '없음');
        recoveryConfirmation.hidden = false;
      } catch (error) {
        if (generation === recoveryGeneration) recoveryFeedback.textContent = error.message;
      } finally { recoveryPreview.disabled = false; }
    });
    recoveryApply.addEventListener('click', async () => {
      const plan = recoveryPlan;
      if (!plan || !currentSession) return;
      const generation = recoveryGeneration;
      recoveryApply.disabled = true;
      recoveryPreview.disabled = true;
      try {
        const result = await memoRequest('POST', '/api/restore/' + encodeURIComponent(plan.id), {
          expectedVersion: plan.version, expectedState: plan.stateVersion,
        });
        if (generation !== recoveryGeneration || !currentSession) return;
        if (result?.id !== plan.id || result.restored !== true || result.verified !== true) {
          throw new Error('복원 결과를 확인할 수 없습니다.');
        }
        resetRecovery();
        recoveryFeedback.textContent = '검증한 사본으로 한 건 복원 완료';
        void loadMemos(currentSession, ++notesGeneration);
      } catch (error) {
        if (generation === recoveryGeneration) {
          resetRecovery();
          recoveryFeedback.textContent = error.message + ' · 변경 항목을 다시 확인하세요.';
        }
      } finally { recoveryApply.disabled = false; recoveryPreview.disabled = false; }
    });
    let notesGeneration = 0;

    const showNotesMessage = (message) => {
      const item = document.createElement('li');
      item.textContent = message;
      notesList.replaceChildren(item);
    };

    const loadMemos = async (session, generation) => {
      showNotesMessage('가상 자료를 불러오는 중입니다.');
      try {
        const response = await fetch('/api/memos', {
          cache: 'no-store',
          credentials: 'same-origin',
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data?.error || `메모 요청 실패 (${response.status})`);
        }
        if (!Array.isArray(data)) {
          throw new Error('자료 응답 형식이 올바르지 않습니다.');
        }
        if (generation !== notesGeneration) return;

        if (data.length === 0) {
          showNotesMessage('등록된 가상 메모가 없습니다.');
          return;
        }

        notesList.replaceChildren(...data.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const body = document.createElement('span');
          title.textContent = note.title;
          body.textContent = note.body ?? '';
          item.append(title, body);
          const actions = document.createElement('div');
          actions.className = 'memo-actions';
          const edit = document.createElement('button');
          edit.type = 'button';
          edit.textContent = '수정';
          edit.addEventListener('click', async () => {
            const newTitle = window.prompt('수정할 제목', note.title);
            if (newTitle === null) return;
            const newBody = window.prompt('수정할 내용', note.body ?? '');
            if (newBody === null) return;
            try {
              await memoRequest('PUT', '/api/memos/' + encodeURIComponent(note.id), {
                title: newTitle, body: newBody,
              });
              memoFeedback.textContent = '수정 완료';
              if (currentSession) void loadMemos(currentSession, ++notesGeneration);
            } catch (error) { memoFeedback.textContent = error.message; }
          });
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.textContent = '삭제';
          remove.addEventListener('click', async () => {
            if (!window.confirm('이 가상 메모를 삭제할까요?')) return;
            try {
              await memoRequest('DELETE', '/api/memos/' + encodeURIComponent(note.id));
              memoFeedback.textContent = '삭제 완료';
              if (currentSession) void loadMemos(currentSession, ++notesGeneration);
            } catch (error) { memoFeedback.textContent = error.message; }
          });
          const restore = document.createElement('button');
          restore.type = 'button';
          restore.textContent = '복원 항목 확인';
          restore.addEventListener('click', () => {
            resetRecovery();
            recoveryId.value = note.id;
            recoveryPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
            document.querySelector('#recovery-preview-form').requestSubmit();
          });
          actions.append(edit, restore, remove);
          item.append(actions);
          return item;
        }));
      } catch (error) {
        if (generation === notesGeneration) {
          showNotesMessage(error.message ?? '메모 요청에 실패했습니다.');
        }
      }
    };

    editor.addEventListener('submit', async (event) => {
      event.preventDefault();
      const add = document.querySelector('#memo-add');
      add.disabled = true;
      memoFeedback.textContent = '';
      try {
        await memoRequest('POST', '/api/memos', {
          title: memoTitle.value, body: memoBody.value,
        });
        editor.reset();
        memoFeedback.textContent = '추가 완료';
        if (currentSession) void loadMemos(currentSession, ++notesGeneration);
      } catch (error) { memoFeedback.textContent = error.message; }
      finally { add.disabled = false; }
    });

    const showError = (message) => { errorText.textContent = message; };
    const renderSession = (session) => {
      const signedIn = Boolean(session?.user);
      const generation = ++notesGeneration;
      currentSession = signedIn ? session : null;
      editor.hidden = !signedIn;
      recoveryPanel.hidden = !signedIn;
      resetRecovery();
      if (!signedIn) recoveryId.value = '';
      if (!signedIn) {
        editor.reset();
        memoFeedback.textContent = '';
      }
      form.hidden = signedIn;
      loggedInView.hidden = !signedIn;
      userEmail.textContent = signedIn ? (session.user.email ?? '이메일 없음') : '';
      status.textContent = signedIn ? '로그인 상태' : '로그아웃 상태';

      if (signedIn) {
        passwordInput.value = '';
        void loadMemos(session, generation);
      } else {
        showNotesMessage('메모를 보려면 로그인하세요.');
      }
    };


    const requestAuth = async (method, payload) => {
      const response = await fetch('/api/auth', {
        method, cache: 'no-store', credentials: 'same-origin',
        ...(payload === undefined ? {} : {
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        }),
      });
      const result = await response.json().catch(() => null);
      if (!response.ok) {
        throw new Error(result?.error || '인증 요청 실패 (' + response.status + ')');
      }
      return result;
    };

    try {
      const result = await requestAuth('GET');
      renderSession(result.authenticated ? { user: { email: result.email } } : null);
    } catch (error) {
      renderSession(null);
      showError(error.message ?? '로그인 상태를 확인할 수 없습니다.');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginBtn.disabled = true;
      showError('');
      try {
        const result = await requestAuth('POST', {
          action: 'login',
          email: emailInput.value.trim(),
          password: passwordInput.value,
        });
        renderSession({ user: { email: result.email } });
      } catch (error) {
        showError(error.message ?? '로그인에 실패했습니다.');
      } finally {
        loginBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener('click', async () => {
      logoutBtn.disabled = true;
      showError('');
      try {
        await requestAuth('POST', { action: 'logout' });
        renderSession(null);
      } catch (error) {
        showError(error.message ?? '로그아웃에 실패했습니다.');
      } finally {
        logoutBtn.disabled = false;
      }
    });

  </script>
</body>
</html>
